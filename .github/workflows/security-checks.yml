name: Menu security and build checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  isolated-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test validation, authentication, CSRF and malicious payloads in isolation
        run: node --test cms/*.test.cjs
      - name: Check admin JavaScript syntax
        run: node --check admin/admin.js
      - name: Build the menu without production credentials
        run: node cms/build.cjs
